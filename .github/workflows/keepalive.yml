name: Render 다운 감시

# ⚠️ 임시 장치다. 외부 업타임 모니터(5분 간격)가 서면 이 파일은 삭제한다.
#
# ── 2026-08-07 실측으로 정정된 것 ────────────────────────────────
# 이 워크플로의 원래 주석은 두 가지를 주장했는데 둘 다 사실이 아니었다.
#
#  (1) "Render 유휴 슬립을 막으려면 10분마다 워밍이 필요하다"
#      → Render는 스핀다운하지 않는다(유료 등급). 8/6 14:39Z 성공 이후 8/7 00:18Z까지
#        9시간 39분간 핑이 한 번도 안 나갔는데(중간 두 번은 러너 미배정으로 실행 자체가 없었다)
#        그 구간에 찍은 /health가 200 / 0.67초였다. 무료 등급은 15분이면 스핀다운한다.
#        즉 워밍 목적은 처음부터 불필요했다.
#
#  (2) "10분마다 돈다"
#      → 실측 주기는 약 2시간이었다. 8/6 하루 144회 예정 중 8회 실행.
#        GitHub 공식 문서: "The `schedule` event can be delayed during periods of high loads
#        ... If the load is sufficiently high enough, some queued jobs may be dropped."
#        (예약 이벤트는 고부하 시 지연될 수 있고, 부하가 충분히 높으면 대기 작업이 폐기될 수 있다.)
#
# ── 그래서 매시 1회(:23)로 낮췄다 ────────────────────────────────
# 지킬 수 없는 10분 주기를 걸어두면 (a) 실행 이력이 "144 중 8"이 되어 신뢰할 수 없고
# (b) 러너 미배정 실패가 워크플로 실패 메일로 와서 진짜 장애와 구분이 안 된다.
# 빈도를 낮추면 배달률이 올라가 실패 신호가 실제 의미를 갖는다(일 단위 배치는 80%대 배달).
# 정각(:00)은 GitHub이 고부하 시간대로 명시한 구간이라 피한다.
#
# 남은 한계: 감지 지연이 최선 1시간이고, 러너 미배정 오탐은 여전히 남는다.
# 앱이 죽으면 /alert 게이트웨이(카카오)도 함께 죽으므로 알림은 GitHub 메일뿐이다.
# 이 셋 다 외부 모니터로만 해소된다.

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: /health 핑 (비정상 시 실패 → GitHub 알림 메일)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://ssangkom-chatbot.onrender.com/health)
          echo "HTTP $code"
          [ "$code" = "200" ]
