name: 서류 갱신 감시

# ssangkom.co.kr이 클라우드 IP를 차단하므로 GitHub Actions에서 직접 갱신은 불가능하다
# (과거 스크래핑 방식은 "발견 0건"으로 조용히 성공 처리되던 함정).
# 실제 갱신 = 로컬 PC의 refresh_and_push.ps1(작업 스케줄러, 매일 09:00 + 4주마다 전량).
# 이 워크플로는 하트비트(last_sync.txt)가 3일 넘게 갱신되지 않으면 실패 → 알림.
# 정상이면 하트비트 나이는 0~1일이다.
# 임계치 3일 = 연휴·주말 PC 종료(부팅 시 StartWhenAvailable로 만회)는 관용하고
# 실제 고장은 사흘 안에 잡는 선. 과거 10일 임계치는 1회 누락을 통과시켜 미탐지였다.
#
# ── 하루 3회로 늘린 이유 (2026-08-07) ────────────────────────────
# 이 감시자 자신이 7/29·7/30 이틀 연속 결측했다(실행 이력 확인). 임계치가 3일인데
# 감시자가 2일 연속 빠지면 남는 여유가 하루뿐이라, 진짜 고장이 결측 구간과 겹치면
# 탐지에 실패한다. GitHub 공식 문서: "If the load is sufficiently high enough,
# some queued jobs may be dropped"(부하가 충분히 높으면 대기 중 작업 일부가 폐기될 수 있다).
# 대응 두 가지 —
#   1) 정각(:00)을 피한다. 같은 문서가 "High load times include the start of every hour"
#      (매시 정각이 고부하 시간대)라고 명시한다. 기존 '0 1 * * *'가 정확히 그 시각이었다.
#   2) 하루 3회로 분산한다. 한 번 폐기돼도 그날 검사가 0회가 되지 않는다.
# 고장 시 알림이 하루 3번 오는 것은 의도된 것이다 — 단일 장애점(사내 PC)이라 재촉이 맞다.
# 근본 해결은 외부 하트비트 모니터(배치가 끝날 때 핑 → 안 오면 알림)이며, 이건 그 전까지의 보강이다.

on:
  schedule:
    # 10:17 / 14:17 / 22:17 KST — 로컬 갱신(09:00) 뒤 첫 검사 + 백스톱 2회. 정각 회피.
    - cron: '17 1,5,13 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 하트비트 검사 (3일 초과 시 실패)
        run: |
          if [ ! -f last_sync.txt ]; then
            echo "::error::last_sync.txt 없음 — 로컬 자동 갱신이 아직 한 번도 실행되지 않았습니다."
            exit 1
          fi
          last=$(head -c 16 last_sync.txt)
          last_epoch=$(date -d "$last" +%s)
          days=$(( ( $(date +%s) - last_epoch ) / 86400 ))
          echo "마지막 서류 갱신: $last (${days}일 전)"
          if [ "$days" -gt 3 ]; then
            echo "::error::서류 갱신이 ${days}일째 없습니다. 로컬 PC의 '쌍곰 챗봇 서류 갱신' 예약 작업을 확인하세요 (PC 꺼짐/강제 종료/스크립트 오류 가능). 작업 스케줄러의 '마지막 실행 결과'와 refresh_and_push.log를 함께 보세요."
            exit 1
          fi

      - name: 실패 시 카카오톡 알림
        if: failure()
        run: |
          curl -s -X POST https://ssangkom-chatbot.onrender.com/alert \
            -H "X-Alert-Token: ${{ secrets.ALERT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"service":"서류 갱신 감시","message":"하트비트 3일 초과 — 매일 돌아야 할 서류 갱신이 멈췄습니다. 로컬 PC의 쌍곰 챗봇 서류 갱신 예약작업(마지막 실행 결과)과 refresh_and_push.log를 확인하세요."}' || true
