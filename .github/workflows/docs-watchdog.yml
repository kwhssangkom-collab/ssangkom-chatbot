name: 서류 갱신 감시

# ssangkom.co.kr이 클라우드 IP를 차단하므로 GitHub Actions에서 직접 갱신은 불가능하다
# (과거 스크래핑 방식은 "발견 0건"으로 조용히 성공 처리되던 함정).
# 실제 갱신 = 로컬 PC의 refresh_and_push.ps1(작업 스케줄러, 매주 월요일).
# 이 워크플로는 하트비트(last_sync.txt)가 3일 넘게 갱신되지 않으면 실패 → 알림 메일.
# 갱신이 매일(로컬 예약작업 09:00)로 바뀌었으므로 정상이면 하트비트 나이는 0~1일이다.
# 임계치 3일 = 연휴·주말 PC 종료(부팅 시 StartWhenAvailable로 만회)는 관용하고
# 실제 고장은 사흘 안에 잡는 선. 과거 10일 임계치는 1회 누락을 통과시켜 미탐지였다.

on:
  schedule:
    # 매일 오전 10시 KST (로컬 갱신 09:00 한 시간 뒤 검사)
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 하트비트 검사 (3일 초과 시 실패)
        run: |
          if [ ! -f last_sync.txt ]; then
            echo "::error::last_sync.txt 없음 — 로컬 자동 갱신이 아직 한 번도 실행되지 않았습니다."
            exit 1
          fi
          last=$(head -c 16 last_sync.txt)
          last_epoch=$(date -d "$last" +%s)
          days=$(( ( $(date +%s) - last_epoch ) / 86400 ))
          echo "마지막 서류 갱신: $last (${days}일 전)"
          if [ "$days" -gt 3 ]; then
            echo "::error::서류 갱신이 ${days}일째 없습니다. 로컬 PC의 '쌍곰 챗봇 서류 갱신' 예약 작업을 확인하세요 (PC 꺼짐/강제 종료/스크립트 오류 가능). 작업 스케줄러의 '마지막 실행 결과'와 refresh_and_push.log를 함께 보세요."
            exit 1
          fi

      - name: 실패 시 카카오톡 알림
        if: failure()
        run: |
          curl -s -X POST https://ssangkom-chatbot.onrender.com/alert \
            -H "X-Alert-Token: ${{ secrets.ALERT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"service":"서류 갱신 감시","message":"하트비트 3일 초과 — 매일 돌아야 할 서류 갱신이 멈췄습니다. 로컬 PC의 쌍곰 챗봇 서류 갱신 예약작업(마지막 실행 결과)과 refresh_and_push.log를 확인하세요."}' || true
